<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Job — AI Resume Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Global Navbar -->
  <div id="navbar-container"></div>

  <main style="max-width: 760px;">
    <!-- Header -->
    <div style="margin-bottom: 24px;">
      <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--neutral-900);" id="form-header-title">Post a New Job</h1>
      <p style="color: var(--neutral-500); font-size: 0.95rem;">Enter job details, required technical skills, and candidate qualifications</p>
    </div>

    <!-- Form Card -->
    <div class="card">
      <form id="job-post-form" novalidate>
        <input type="hidden" id="job-id" name="job_id">

        <div class="grid grid-cols-2" style="gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="job-title">Job Title *</label>
            <input type="text" class="form-input" id="job-title" placeholder="e.g. Senior Backend Engineer" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-company">Company Name *</label>
            <input type="text" class="form-input" id="job-company" placeholder="e.g. CloudScale Systems" required>
          </div>
        </div>

        <div class="grid grid-cols-2" style="gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="job-location">Location *</label>
            <input type="text" class="form-input" id="job-location" placeholder="e.g. Remote / San Francisco, CA" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-type">Job Type *</label>
            <select class="form-select" id="job-type" required>
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Contract">Contract</option>
              <option value="Remote">Remote</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3" style="gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="job-level">Experience Level</label>
            <select class="form-select" id="job-level">
              <option value="Entry">Entry Level</option>
              <option value="Mid" selected>Mid Level</option>
              <option value="Senior">Senior Level</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="job-min-years">Min Experience (Years)</label>
            <input type="number" class="form-input" id="job-min-years" min="0" value="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="job-degree">Required Degree</label>
            <select class="form-select" id="job-degree">
              <option value="None">None Required</option>
              <option value="High School">High School</option>
              <option value="Associate">Associate Degree</option>
              <option value="Bachelor" selected>Bachelor's Degree</option>
              <option value="Master">Master's Degree</option>
              <option value="Doctorate">Doctorate</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="job-skills">Required Technical Skills (Comma-separated) *</label>
          <input type="text" class="form-input" id="job-skills" placeholder="e.g. Python, FastAPI, Docker, PostgreSQL" required>
          <span class="form-help">Separate skills with commas</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="job-soft-skills">Soft Skills (Comma-separated)</label>
          <input type="text" class="form-input" id="job-soft-skills" placeholder="e.g. Leadership, Problem Solving, Communication">
        </div>

        <div class="form-group">
          <label class="form-label" for="job-salary">Salary Range (Optional)</label>
          <input type="text" class="form-input" id="job-salary" placeholder="e.g. $120,000 - $150,000">
        </div>

        <div class="form-group">
          <label class="form-label" for="job-description">Full Job Description *</label>
          <textarea class="form-textarea" id="job-description" rows="6" placeholder="Provide position summary, key responsibilities, and team expectations..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <a href="jobs.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="save-job-btn">Save Job Posting</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="footer-container"></div>

  <!-- Shared JavaScript -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
